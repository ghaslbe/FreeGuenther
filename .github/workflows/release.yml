# Baut bei jedem Push auf main die eigenständige FreeGuenther.exe, den Installer FreeGuenther-Setup.exe und die
# Mac-App und legt alle als Release "v<Version>" ab (Version aus LmChat/LmChat.csproj).
# Gibt es das Release schon, werden nur die Dateien ersetzt.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Einzel-.exe bauen
        run: dotnet publish LmChat -c Release -o publish -p:DebugType=none

      - name: Version auslesen
        id: version
        shell: bash
        run: echo "version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' LmChat/LmChat.csproj)" >> "$GITHUB_OUTPUT"

      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          & $iscc.FullName /Q "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$env:GITHUB_WORKSPACE\publish" installer\FreeGuenther.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release v<Version> anlegen oder aktualisieren
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          FILES="publish/FreeGuenther-Setup.exe publish/FreeGuenther.exe"
          # Altes rollendes Release aus früheren Builds entfernen
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES \
              --title "FreeGuenther $VERSION" \
              --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7}.

          **FreeGuenther-Setup.exe** – Installer: Startmenü-Eintrag, optional Desktop-Symbol, Deinstallation über die Windows-Einstellungen. Keine Administratorrechte nötig. Ersetzt eine vorhandene Installation von „LM Chat“.
          **FreeGuenther.exe** – portabel: einfach herunterladen und starten, keine Installation.
          **FreeGuenther-mac-arm64.zip** – Mac mit Apple Silicon: entpacken und starten. Nicht notarisiert, siehe README.

          ⚠ Bei Online-Anbietern (OpenAI, Anthropic, OpenRouter) unbedingt ein Ausgabenlimit für den API-Schlüssel setzen." \
              --target "$GITHUB_SHA" \
              --latest
          fi

  # Läuft nach dem Windows-Build, weil der das Release anlegt. Xcode, SDK und Workload müssen zueinander passen:
  # Workload-Stand 10.0.401 enthält das macOS-26.5-SDK, neuere Stände verlangen Xcode 27.
  mac:
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.403

      - name: Xcode wählen
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: macOS-Workload installieren
        run: dotnet workload install macos --version 10.0.401

      - name: Mac-App bauen
        run: FreeGuenther.Mac/build.sh

      - name: Ins Release hochladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' LmChat/LmChat.csproj)
          gh release upload "v$VERSION" FreeGuenther.Mac/bin/Release/FreeGuenther-mac-arm64.zip --clobber
