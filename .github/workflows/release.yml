# Baut bei jedem Push auf main die eigenständige LmChat.exe und legt sie
# als Release "v<Version>" ab (Version aus LmChat/LmChat.csproj).
# Gibt es das Release schon, wird nur die .exe ersetzt.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Einzel-.exe bauen
        run: dotnet publish LmChat -c Release -o publish -p:DebugType=none

      - name: Release v<Version> anlegen oder aktualisieren
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' LmChat/LmChat.csproj)
          TAG="v$VERSION"
          # Altes rollendes Release aus früheren Builds entfernen
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" publish/LmChat.exe --clobber
          else
            gh release create "$TAG" publish/LmChat.exe \
              --title "LmChat $VERSION" \
              --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7}. Einfach LmChat.exe herunterladen und starten – keine Installation nötig." \
              --target "$GITHUB_SHA" \
              --latest
          fi
